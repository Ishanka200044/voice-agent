<!DOCTYPE html>
<html lang="si"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b0f14"><title>සහායක</title>
<link rel="manifest" href="manifest.json"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b0f14;--card:#2a1820;--ink:#f6ead9;--dim:#b79da0;--saf:#f2b134;--mar:#8d1b3d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans Sinhala',system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
header b{font-size:1.15rem;color:var(--saf)}
header button{background:none;border:1px solid #4a2d38;color:var(--dim);border-radius:20px;padding:6px 14px;font:inherit;font-size:.85rem}
#log{flex:1;overflow-y:auto;padding:8px 18px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.6;font-size:.95rem;white-space:pre-wrap}
.u{align-self:flex-end;background:var(--mar)}
.a{align-self:flex-start;background:var(--card)}
.s{align-self:center;color:var(--dim);font-size:.8rem}
.a a{color:var(--saf)}
#bar{padding:10px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
#mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--saf);font-size:2rem;color:#2a1000;box-shadow:0 0 0 0 rgba(242,177,52,.5)}
#mic.on{background:#ff6b57;animation:p 1.2s infinite}
@keyframes p{70%{box-shadow:0 0 0 22px rgba(242,177,52,0)}100%{box-shadow:0 0 0 0 rgba(242,177,52,0)}}
@media(prefers-reduced-motion:reduce){#mic.on{animation:none}}
#st{font-size:.82rem;color:var(--dim);min-height:1.2em}
#tx{display:flex;gap:8px;width:100%}
#tx input{flex:1;background:var(--card);border:1px solid #4a2d38;border-radius:22px;color:var(--ink);padding:11px 16px;font:inherit;outline:none}
#tx input:focus,#mic:focus-visible,button:focus-visible{outline:2px solid var(--saf)}
#tx button{background:var(--card);border:1px solid #4a2d38;color:var(--ink);border-radius:22px;padding:0 16px;font:inherit}
dialog{background:var(--card);color:var(--ink);border:1px solid #4a2d38;border-radius:18px;padding:20px;width:min(92vw,420px);margin:auto}
dialog::backdrop{background:#000a}
dialog label{display:block;font-size:.85rem;color:var(--dim);margin:12px 0 4px}
dialog input,dialog select{width:100%;background:var(--bg);border:1px solid #4a2d38;border-radius:10px;color:var(--ink);padding:10px;font:inherit}
dialog .r{display:flex;gap:10px;margin-top:16px}
dialog button{flex:1;padding:11px;border-radius:12px;border:0;font:inherit;font-weight:600;background:var(--saf);color:#2a1000}
</style></head><body>
<header><b>සහායක</b><button id="cfg">සැකසුම්</button></header>
<div id="log" aria-live="polite"></div>
<div id="bar">
<div id="st">මයික් එක ඔබලා කතා කරන්න</div>
<button id="mic" aria-label="කතා කරන්න">🎤</button>
<form id="tx"><input id="ti" placeholder="නැත්නම් මෙතන type කරන්න" autocomplete="off"><button>යවන්න</button></form>
</div>
<dialog id="dlg"><b>සැකසුම්</b>
<label>සේවාව</label><select id="prov"><option value="gemini">Google Gemini (නොමිලේ)</option><option value="claude">Anthropic Claude (ගෙවීම්)</option></select>
<label>API key (මෙම phone එකේ පමණක් save වෙයි)</label><input id="key" type="password" placeholder="aistudio.google.com වලින් නොමිලේ ගන්න">
<label>Model නම (වැඩ නොකළොත් AI Studio එකෙන් අලුත් නම බලන්න)</label><input id="mdl" placeholder="gemini-3.8-flash">
<label>කථන වේගය</label><input id="rate" type="range" min=".7" max="1.3" step=".1" value="1">
<label><input id="hf" type="checkbox" style="width:auto"> Hands-free (පිළිතුරෙන් පසු ස්වයංක්‍රීයව අහන්න)</label>
<div class="r"><button id="sv">Save</button></div></dialog>
<script>
const $=id=>document.getElementById(id),log=$('log'),S=JSON.parse(localStorage.getItem('va')||'{}');
const save=()=>localStorage.setItem('va',JSON.stringify(S));
let hist=[],rec=null,busy=false,notes=JSON.parse(localStorage.getItem('vn')||'[]');
const SYS=`ඔබ පරිශීලකයාගේ phone එකේ voice සහායකයා. ඔහු සිංහලෙන් (හෝ Singlish) කතා කරයි. හැම විටම සරල, කෙටි, කතා කරන විදිහේ සිංහලෙන් පිළිතුරු දෙන්න (වාක්‍ය 1-3). Markdown, emoji, ලැයිස්තු භාවිතා නොකරන්න - ඔබේ පිළිතුර හඬින් කියවෙයි.
Phone එකේ දෙයක් කරන්න අවශ්‍ය නම් පිළිතුරේ අවසානයේ මෙම JSON පේළිය එක් කරන්න: ACTION:{"type":"...",...}
type අගයන්: 
open {url} - ඕනෑම link එකක් (https://..., tel:+94..., sms:+94...?body=..., geo:0,0?q=..., https://wa.me/94...?text=..., https://www.youtube.com/results?search_query=..., https://www.google.com/search?q=...)
timer {seconds,label} - app එක ඇතුළත ටයිමරයක්
alarm {hour,minute,label} - 24h
note {text} - සටහනක් save කරන්න
readnotes {} - සටහන් කියවන්න
ඔබට web කියවන්න/phone හි සෘජුවම app පාලනය කරන්න බැරි බව සැබෑවට අදාළ නම් අවංකව කියන්න. දැනට: ${new Date().toLocaleString('si-LK')}. ප්‍රශ්නයක් විතරක් නම් ACTION නොදමන්න.`;
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function say(t,cb){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='si-LK';u.rate=+S.rate||1;
const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('si'));if(v)u.voice=v;
u.onend=()=>cb&&cb();u.onerror=()=>cb&&cb();speechSynthesis.speak(u)}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){$('st').textContent='මෙම browser එකේ voice නැත. Chrome භාවිතා කරන්න';return}
if(busy)return;speechSynthesis.cancel();rec=new SR();rec.lang='si-LK';rec.interimResults=true;let fin='';
rec.onstart=()=>{$('mic').classList.add('on');$('st').textContent='අහගෙන ඉන්නවා...'};
rec.onresult=e=>{fin='';for(const r of e.results)fin+=r[0].transcript;$('st').textContent=fin};
rec.onerror=e=>{$('mic').classList.remove('on');$('st').textContent=e.error==='not-allowed'?'මයික් අවසරය ලබා දෙන්න':'නැවත උත්සාහ කරන්න'};
rec.onend=()=>{$('mic').classList.remove('on');if(fin.trim())send(fin.trim());else $('st').textContent='මයික් එක ඔබලා කතා කරන්න'};
rec.start()}
async function send(t){busy=true;add(t,'u');$('st').textContent='හිතනවා...';hist.push({role:'user',content:t});
if(!S.key){add('පළමුව සැකසුම් වලට ගොස් API key එක දාන්න','s');busy=false;$('dlg').showModal();return}
try{let out;if(S.prov==='claude'){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
body:JSON.stringify({model:S.model||'claude-sonnet-4-6',max_tokens:600,system:SYS,messages:hist.slice(-20)})});
const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);out=j.content.map(c=>c.text||'').join('')}
else{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+(S.model||'gemini-3.8-flash')+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':S.key},
body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:hist.slice(-20).map(h=>({role:h.role==='user'?'user':'model',parts:[{text:h.content}]}))})});
const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);out=(j.candidates?.[0]?.content?.parts||[]).map(c=>c.text||'').join('')}
hist.push({role:'assistant',content:out});
const m=out.match(/ACTION:(\{.*\})/s);let act=null;if(m){try{act=JSON.parse(m[1])}catch(e){}out=out.replace(/ACTION:\{.*\}/s,'').trim()}
add(out,'a');$('st').textContent='';
const after=()=>{busy=false;S.hf&&listen()};
if(act){const x=run(act);if(x)out+=' '+x}
say(out,after)}catch(e){add('දෝෂයක්: '+e.message,'s');busy=false;$('st').textContent=''}}
function run(a){try{switch(a.type){
case'open':setTimeout(()=>location.href=a.url,1800);add('විවෘත කරනවා: '+a.url,'s');break;
case'timer':{const s=+a.seconds,d=add('','s');const end=Date.now()+s*1e3;const i=setInterval(()=>{const l=Math.max(0,Math.round((end-Date.now())/1e3));d.textContent=(a.label||'ටයිමරය')+': '+Math.floor(l/60)+':'+String(l%60).padStart(2,'0');
if(!l){clearInterval(i);say((a.label||'ටයිමරය')+' අවසන්');navigator.vibrate&&navigator.vibrate([400,200,400])}},500);break}
case'alarm':setTimeout(()=>location.href=`intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${a.hour};i.android.intent.extra.alarm.MINUTES=${a.minute};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(a.label||'')};B.android.intent.extra.alarm.SKIP_UI=false;end`,1800);break;
case'note':notes.push(a.text);localStorage.setItem('vn',JSON.stringify(notes));add('සටහන: '+a.text,'s');break;
case'readnotes':return notes.length?'ඔබේ සටහන්: '+notes.join('. '):'සටහන් කිසිවක් නැත'}}catch(e){}}
$('mic').onclick=()=>{if(rec&&$('mic').classList.contains('on'))rec.stop();else listen()};
$('tx').onsubmit=e=>{e.preventDefault();const v=$('ti').value.trim();if(v&&!busy){$('ti').value='';send(v)}};
$('cfg').onclick=()=>{$('key').value=S.key||'';$('prov').value=S.prov||'gemini';$('mdl').value=S.model||'';$('rate').value=S.rate||1;$('hf').checked=!!S.hf;$('dlg').showModal()};
$('sv').onclick=()=>{S.key=$('key').value.trim();S.prov=$('prov').value;S.model=$('mdl').value.trim();S.rate=$('rate').value;S.hf=$('hf').checked;save();$('dlg').close()};
speechSynthesis.getVoices();
add('ආයුබෝවන්! මම ඔබේ voice සහායකයා. ඕනෑම දෙයක් කියන්න - call කරන්න, WhatsApp යවන්න, alarm දාන්න, ප්‍රශ්න අහන්න.','a');
if(!S.key)setTimeout(()=>$('dlg').showModal(),400);
</script></body></html>
